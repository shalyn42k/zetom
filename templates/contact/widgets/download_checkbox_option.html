<!--
# === FILE SUMMARY ===
# Purpose: Template snippet for rendering checkbox options in download selection lists.
# Responsible for: Displaying checkbox inputs with labels for choosing exported fields.
# Connected to: DownloadMessagesForm widget customisation in admin templates.
# Important classes/functions: N/A (template snippet)
# Notes: Relies on provided widget/option attributes for accessibility.
# =====================================
-->
<label class="download-item"{% if widget.attrs.id %} for="{{ option.attrs.id }}"{% endif %}>
    <input type="checkbox"
           name="{{ widget.name }}"
           value="{{ option.value }}"
           {% include "django/forms/widgets/attrs.html" with attrs=widget.attrs only %}
           {% include "django/forms/widgets/attrs.html" with attrs=option.attrs only %}
           {% if option.selected %}checked{% endif %}>
    <span class="download-item__label">{{ option.label }}</span>
</label>

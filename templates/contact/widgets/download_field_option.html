<!--
# === FILE SUMMARY ===
# Purpose: Render a single checkbox option for selecting fields in download forms.
# Responsible for: Displaying input elements with labels for PDF export selection UI.
# Connected to: DownloadMessagesForm field rendering in admin panel templates.
# Important classes/functions: N/A (template snippet)
# Notes: Uses built-in Django widget attributes for accessibility.
# =====================================
-->
<label class="download-option"{% if widget.attrs.id %} for="{{ option.attrs.id }}"{% endif %}>
    <input type="checkbox"
           name="{{ widget.name }}"
           value="{{ option.value }}"
           {% include "django/forms/widgets/attrs.html" with attrs=widget.attrs only %}
           {% include "django/forms/widgets/attrs.html" with attrs=option.attrs only %}
           {% if option.selected %}checked{% endif %}>
    <span class="download-option__label">{{ option.label }}</span>
</label>

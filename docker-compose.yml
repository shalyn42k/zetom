version: '3.8'

services:
  # === БАЗА ДАННЫХ (PostgreSQL) ===
  db:
    image: postgres:16
    container_name: zetom_db
    restart: always
    environment:
      # Твои реальные настройки
      POSTGRES_USER: zetom_user
      POSTGRES_DB: zetom
      POSTGRES_PASSWORD: zetom_password  # Пароль задаем здесь (можно поменять)
    volumes:
      # 1. СЮДА кладем твой файл init.sql, чтобы данные появились сами
      - ./db_setup/init.sql:/docker-entrypoint-initdb.d/init.sql
      # 2. Здесь данные будут храниться постоянно
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zetom_user -d zetom"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === ТВОЙ САЙТ (Django) ===
  web:
    build: .
    container_name: zetom_app
    restart: on-failure
    ports:
      - "8888:8888"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Настройки Django
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
      # Строка подключения: postgres://ПОЛЬЗОВАТЕЛЬ:ПАРОЛЬ@ХОСТ:ПОРТ/БАЗА
      DATABASE_URL: postgres://zetom_user:zetom_password@db:5432/zetom
      # Запрещаем откат к sqlite
      DJANGO_ALLOW_SQLITE_FALLBACK: "false"
    volumes:
      - ./:/app

volumes:
  postgres_data: